<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>vulu Launcher Güncelleyici</title>
<style>
@font-face { font-family: "IBM Plex Mono"; src: url("__FONT__") format("truetype"); font-weight: 400 700; }
@font-face { font-family: "IBM Plex Sans"; src: url("__SANS__") format("truetype"); font-weight: 100 700; }

/* Launcher ile aynı dil: ölçülü köşeler, katmanlı yüzeyler, büyük harf dönüşümü yok */
:root {
    --bg: #0b0a09;
    --panel: #0f0e0c;
    --surface: #151311;
    --line: rgba(255, 255, 255, .07);
    --line-strong: rgba(255, 255, 255, .12);
    --text: #ece6dd;
    --muted: #9b9188;
    --dim: #6a625a;
    --accent: #c27e3e;
    --accent-hi: #d9a06a;
    --accent-ink: #120c06;
    --ok: #7cc47f;
    --error: #e2604a;
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; overflow: hidden; }
body {
    display: flex; flex-direction: column; background: var(--bg); color: var(--text);
    font: 13px/1.5 "IBM Plex Sans", "Segoe UI", sans-serif;
    user-select: none; -webkit-user-select: none; cursor: default;
    border: 1px solid var(--line-strong); border-radius: 10px; overflow: hidden;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

.top { height: 36px; flex: none; display: flex; align-items: stretch; background: var(--panel); border-bottom: 1px solid var(--line); }
.brand { flex: 1; display: flex; align-items: center; gap: 9px; padding: 0 12px; }
.brand img { width: 16px; height: 16px; image-rendering: pixelated; border-radius: 3px; }
.brand b { font: 700 13px "IBM Plex Sans", "Segoe UI", sans-serif; letter-spacing: -.01em; }
.top button { width: 34px; height: 28px; margin: 4px 2px; border: 0; border-radius: 6px; background: transparent; display: grid; place-items: center; }
.top button:hover { background: var(--surface); }
.top #close:hover { background: #a8321f; }
.top svg { width: 10px; height: 10px; fill: none; stroke: var(--muted); stroke-width: 1.5; stroke-linecap: round; }
.top button:hover svg { stroke: var(--text); }

main { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 22px 22px 18px; }

.label { font-size: 12px; font-weight: 600; color: var(--muted); }
.ver { margin-top: 4px; font-size: 11px; color: var(--dim); }

.status { margin-top: 28px; }
#title { font: 600 16px/1.35 "IBM Plex Sans", sans-serif; min-height: 22px; overflow-wrap: anywhere; }
body.error #title { color: var(--error); }
#detail { margin-top: 4px; font: 11.5px "IBM Plex Mono", monospace; color: var(--muted); min-height: 18px; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }

.bar { position: relative; height: 5px; margin-top: 14px; border-radius: 5px; background: rgba(255, 255, 255, .08); overflow: hidden; }
.bar-fill { height: 100%; width: 0; border-radius: 5px; background: var(--accent); transition: width .2s ease; }
.bar.indeterminate .bar-fill { width: 30%; animation: slide 1.3s ease-in-out infinite; }
body.launching .bar-fill { background: var(--ok); }
body.error .bar { visibility: hidden; }
@keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(340%); } }

.notes { margin-top: 18px; max-height: 120px; overflow-y: auto; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); font-size: 11.5px; color: #d6cdc2; white-space: pre-line; }
.notes b { display: block; margin-bottom: 6px; font-size: 12px; font-weight: 600; color: var(--accent-hi); }
.notes::-webkit-scrollbar { width: 6px; }
.notes::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, .12); border-radius: 6px; }

.actions { margin-top: auto; padding-top: 16px; display: flex; gap: 6px; }
.actions button { flex: 1; height: 34px; border-radius: 6px; font-weight: 600; font-size: 12.5px; }
.btn { border: 1px solid var(--line-strong); background: var(--surface); }
.btn:hover { border-color: var(--muted); }
.btn-primary { border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); }
.btn-primary:hover { background: var(--accent-hi); border-color: var(--accent-hi); }

[hidden] { display: none !important; }
</style>
</head>
<body class="checking">
    <div class="top" id="drag">
        <div class="brand"><img src="__LOGO__" alt=""><b>vulu Launcher</b></div>
        <button id="minimize" aria-label="Küçült" title="Küçült"><svg viewBox="0 0 12 12"><path d="M2 6h8"/></svg></button>
        <button id="close" aria-label="Kapat" title="Kapat"><svg viewBox="0 0 12 12"><path d="M2.5 2.5l7 7M9.5 2.5l-7 7"/></svg></button>
    </div>

    <main id="main">
        <div class="label">Güncelleyici · v__VERSION__</div>

        <div class="status" role="status" aria-live="polite">
            <div id="title">Başlatılıyor…</div>
            <div id="detail"></div>
            <div id="bar" class="bar indeterminate"><div id="fill" class="bar-fill"></div></div>
        </div>

        <div id="notes" class="notes" hidden><b id="notes-title"></b><span id="notes-text"></span></div>

        <div id="actions" class="actions" hidden>
            <button id="launch" class="btn">Yine de aç</button>
            <button id="retry" class="btn-primary">Tekrar dene</button>
        </div>
    </main>

<script>
const $ = id => document.getElementById(id);
const send = (cmd) => { if (window.external && window.external.sendMessage) window.external.sendMessage(JSON.stringify({ cmd })); };

function render(status) {
    document.body.className = status.state;
    $('title').textContent = status.title;
    $('detail').textContent = status.detail || '';

    const determinate = typeof status.progress === 'number';
    $('bar').classList.toggle('indeterminate', !determinate && status.state !== 'launching');
    $('fill').style.width = determinate ? Math.round(status.progress * 100) + '%' : (status.state === 'launching' ? '100%' : '');

    const hasNotes = !!(status.notes && status.notes.trim());
    $('notes').hidden = !hasNotes || status.state === 'error';
    if (hasNotes) {
        $('notes-title').textContent = 'v' + status.version + ' yenilikleri';
        $('notes-text').textContent = status.notes.trim();
    }

    $('actions').hidden = status.state !== 'error';
    if (status.state === 'error') $('retry').focus();
}

if (window.external && window.external.receiveMessage)
    window.external.receiveMessage(raw => { try { render(JSON.parse(raw)); } catch (e) { console.error(e); } });

$('minimize').addEventListener('click', () => send('minimize'));
$('close').addEventListener('click', () => send('close'));
$('retry').addEventListener('click', () => send('retry'));
$('launch').addEventListener('click', () => send('launch'));

// Çerçevesiz pencere: düğmeler dışında her yerden sürüklenir
let dragging = false, framePending = false;
document.addEventListener('pointerdown', e => {
    if (e.button !== 0 || e.target.closest('button, .notes')) return;
    dragging = true;
    document.body.setPointerCapture(e.pointerId);
    send('dragStart');
});
document.addEventListener('pointermove', () => {
    if (!dragging || framePending) return;
    framePending = true;
    requestAnimationFrame(() => { framePending = false; if (dragging) send('dragMove'); });
});
document.addEventListener('pointerup', () => { dragging = false; });
document.addEventListener('pointercancel', () => { dragging = false; });

window.addEventListener('DOMContentLoaded', () => send('ready'));
</script>
</body>
</html>
