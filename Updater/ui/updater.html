<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>vulu Launcher Güncelleyici</title>
<style>
@font-face { font-family: "Sora"; src: url("__FONT__") format("truetype"); font-weight: 100 800; }

:root {
    --bg: #0d0a08;
    --surface: #15100c;
    --border: #2a2018;
    --text: #f2ebe3;
    --muted: #a89a8c;
    --dim: #7a6c5f;
    --accent: #c98a4b;
    --accent-bright: #e0a96a;
    --ok: #6fbf73;
    --error: #e0634d;
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; overflow: hidden; }
body {
    display: flex; flex-direction: column;
    background: radial-gradient(420px 300px at 50% 0%, #3a22124d, transparent 70%), var(--bg);
    color: var(--text); font: 13px/1.45 "Sora", "Segoe UI", sans-serif;
    user-select: none; -webkit-user-select: none; cursor: default;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--accent-bright); outline-offset: 2px; }

.top { height: 38px; flex: none; display: flex; justify-content: flex-end; align-items: center; gap: 2px; padding: 0 6px; }
.top button { width: 32px; height: 28px; border: 0; border-radius: 6px; background: transparent; display: grid; place-items: center; }
.top button:hover { background: #ffffff14; }
.top #close:hover { background: #b33a2b; }
.top svg { width: 12px; height: 12px; fill: none; stroke: var(--muted); stroke-width: 1.5; stroke-linecap: round; }
.top button:hover svg { stroke: var(--text); }

main { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; padding: 6px 28px 22px; text-align: center; }

.logo { position: relative; width: 84px; height: 84px; margin-top: 8px; display: grid; place-items: center; }
.logo img { width: 56px; height: 56px; image-rendering: pixelated; position: relative; z-index: 1; filter: drop-shadow(0 6px 18px #000); }
.logo::before {
    content: ""; position: absolute; inset: 0; border-radius: 50%;
    background: radial-gradient(circle, #c98a4b40, transparent 70%);
    animation: breathe 2.2s ease-in-out infinite;
}
.logo::after {
    content: ""; position: absolute; inset: 4px; border-radius: 50%;
    border: 2px solid transparent; border-top-color: var(--accent); border-right-color: #c98a4b55;
    animation: spin 1.1s linear infinite;
}
body.error .logo::after, body.launching .logo::after { display: none; }
body.error .logo::before { animation: none; background: radial-gradient(circle, #e0634d33, transparent 70%); }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes breathe { 50% { transform: scale(1.12); opacity: .6; } }

h1 { margin: 14px 0 0; font-size: 17px; font-weight: 700; }
.ver { margin-top: 2px; font-size: 11px; color: var(--dim); }

.status { margin-top: 20px; width: 100%; }
#title { font-size: 13.5px; font-weight: 600; min-height: 20px; }
body.error #title { color: var(--error); }
#detail { margin-top: 3px; font-size: 11.5px; color: var(--muted); min-height: 17px; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }

.bar { position: relative; height: 6px; margin-top: 12px; border-radius: 3px; background: #2a2018; overflow: hidden; }
.bar-fill { height: 100%; width: 0; border-radius: 3px; background: var(--accent); transition: width .2s ease; }
.bar.indeterminate .bar-fill { width: 35%; animation: slide 1.2s ease-in-out infinite; }
body.launching .bar-fill { background: var(--ok); }
body.error .bar { visibility: hidden; }
@keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(290%); } }

.notes {
    width: 100%; margin-top: 14px; max-height: 84px; overflow-y: auto; padding: 10px 12px; text-align: left;
    border: 1px solid var(--border); border-radius: 10px; background: var(--surface);
    font-size: 11.5px; color: #d9cbbb; white-space: pre-line;
}
.notes b { display: block; margin-bottom: 4px; font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent-bright); }
.notes::-webkit-scrollbar { width: 8px; }
.notes::-webkit-scrollbar-thumb { background: #3a2d22; border-radius: 6px; }

.actions { margin-top: auto; padding-top: 16px; display: flex; gap: 8px; width: 100%; }
.actions button { flex: 1; height: 38px; border-radius: 9px; font-weight: 600; font-size: 12.5px; }
.btn { border: 1px solid #4a3522; background: var(--surface); }
.btn:hover { background: #241a12; border-color: var(--accent); }
.btn-primary { border: 1px solid var(--accent); background: var(--accent); color: #140d07; }
.btn-primary:hover { background: var(--accent-bright); border-color: var(--accent-bright); }

[hidden] { display: none !important; }
</style>
</head>
<body class="checking">
    <div class="top" id="drag">
        <button id="minimize" aria-label="Küçült" title="Küçült"><svg viewBox="0 0 12 12"><path d="M2 6h8"/></svg></button>
        <button id="close" aria-label="Kapat" title="Kapat"><svg viewBox="0 0 12 12"><path d="M2.5 2.5l7 7M9.5 2.5l-7 7"/></svg></button>
    </div>

    <main id="main">
        <div class="logo" aria-hidden="true"><img src="__LOGO__" alt=""></div>
        <h1>vulu Launcher</h1>
        <div class="ver">Güncelleyici v__VERSION__</div>

        <div class="status" role="status" aria-live="polite">
            <div id="title">Başlatılıyor…</div>
            <div id="detail"></div>
            <div id="bar" class="bar indeterminate"><div id="fill" class="bar-fill"></div></div>
        </div>

        <div id="notes" class="notes" hidden><b id="notes-title"></b><span id="notes-text"></span></div>

        <div id="actions" class="actions" hidden>
            <button id="launch" class="btn">Yine de aç</button>
            <button id="retry" class="btn-primary">Tekrar dene</button>
        </div>
    </main>

<script>
const $ = id => document.getElementById(id);
const send = (cmd) => { if (window.external && window.external.sendMessage) window.external.sendMessage(JSON.stringify({ cmd })); };

function render(status) {
    document.body.className = status.state;
    $('title').textContent = status.title;
    $('detail').textContent = status.detail || '';

    const determinate = typeof status.progress === 'number';
    $('bar').classList.toggle('indeterminate', !determinate && status.state !== 'launching');
    $('fill').style.width = determinate ? Math.round(status.progress * 100) + '%' : (status.state === 'launching' ? '100%' : '');

    const hasNotes = !!(status.notes && status.notes.trim());
    $('notes').hidden = !hasNotes || status.state === 'error';
    if (hasNotes) {
        $('notes-title').textContent = 'v' + status.version + ' yenilikleri';
        $('notes-text').textContent = status.notes.trim();
    }

    $('actions').hidden = status.state !== 'error';
    if (status.state === 'error') $('retry').focus();
}

if (window.external && window.external.receiveMessage)
    window.external.receiveMessage(raw => { try { render(JSON.parse(raw)); } catch (e) { console.error(e); } });

$('minimize').addEventListener('click', () => send('minimize'));
$('close').addEventListener('click', () => send('close'));
$('retry').addEventListener('click', () => send('retry'));
$('launch').addEventListener('click', () => send('launch'));

// Çerçevesiz pencere: düğmeler dışında her yerden sürüklenir
let dragging = false, framePending = false;
document.addEventListener('pointerdown', e => {
    if (e.button !== 0 || e.target.closest('button, .notes')) return;
    dragging = true;
    document.body.setPointerCapture(e.pointerId);
    send('dragStart');
});
document.addEventListener('pointermove', () => {
    if (!dragging || framePending) return;
    framePending = true;
    requestAnimationFrame(() => { framePending = false; if (dragging) send('dragMove'); });
});
document.addEventListener('pointerup', () => { dragging = false; });
document.addEventListener('pointercancel', () => { dragging = false; });

window.addEventListener('DOMContentLoaded', () => send('ready'));
</script>
</body>
</html>
