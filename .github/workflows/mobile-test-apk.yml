# vulu Sosyal (Mobile/) için deneme APK'sı: GitHub'da derlenir, Actions sayfasından "artifact" olarak indirilir.
# SDK'nın geçici hata ayıklama anahtarıyla imzalanır; yayınlanmaz. Yayın APK'sı kendi anahtarıyla imzalanacak.
name: Mobile test APK

on:
  workflow_dispatch:
  push:
    paths:
      - "Mobile/**"
      - "Social/**"
      - "Shared/**"
      - ".github/workflows/mobile-test-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: "21"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Android workload
        run: dotnet workload install android

      - name: Android SDK paketleri
        run: >
          dotnet build Mobile/Vulu.Mobile.Android/Vulu.Mobile.Android.csproj -t:InstallAndroidDependencies
          -p:AndroidSdkDirectory="$ANDROID_HOME" -p:JavaSdkDirectory="$JAVA_HOME" -p:AcceptAndroidSDKLicenses=True

      - name: Release APK
        run: >
          dotnet publish Mobile/Vulu.Mobile.Android/Vulu.Mobile.Android.csproj -c Release -o out
          -p:AndroidSdkDirectory="$ANDROID_HOME" -p:JavaSdkDirectory="$JAVA_HOME"

      - uses: actions/upload-artifact@v4
        with:
          name: vulu-social-test-apk
          path: out/*-Signed.apk
          if-no-files-found: error
