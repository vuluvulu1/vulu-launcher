# vulu Sosyal (Mobile/) için deneme APK'sı: GitHub'da derlenir ve "social-test" ön sürümüne (pre-release) konur;
# telefondan doğrudan indirilir: https://github.com/vuluvulu1/vulu-launcher/releases/download/social-test/vulu-sosyal-test.apk
# SDK'nın geçici hata ayıklama anahtarıyla imzalanır. Yayın APK'sı kendi anahtarıyla imzalanıp siteden dağıtılacak.
# Ön sürüm "son sürüm" sayılmaz; launcher'ların güncellemesi GitHub'a değil vuluvulu.com.tr'ye bakar.
name: Mobile test APK

on:
  workflow_dispatch:
  push:
    paths:
      - "Mobile/**"
      - "Social/**"
      - "Shared/**"
      - ".github/workflows/mobile-test-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: "21"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Android workload
        run: dotnet workload install android

      # Firebase ayarı (push bildirimleri): repoda değil, GOOGLE_SERVICES_JSON sırrında. Yoksa APK push'suz derlenir.
      - name: Firebase ayarı
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > Mobile/Vulu.Mobile.Android/google-services.json
            echo "Firebase ayarı eklendi."
          else
            echo "::warning::GOOGLE_SERVICES_JSON sırrı yok; APK push bildirimi olmadan derleniyor."
          fi

      - name: Android SDK paketleri
        run: >
          dotnet build Mobile/Vulu.Mobile.Android/Vulu.Mobile.Android.csproj -t:InstallAndroidDependencies
          -p:AndroidSdkDirectory="$ANDROID_HOME" -p:JavaSdkDirectory="$JAVA_HOME" -p:AcceptAndroidSDKLicenses=True

      - name: Release APK
        run: >
          dotnet publish Mobile/Vulu.Mobile.Android/Vulu.Mobile.Android.csproj -c Release -o out
          -p:AndroidSdkDirectory="$ANDROID_HOME" -p:JavaSdkDirectory="$JAVA_HOME"

      - uses: actions/upload-artifact@v4
        with:
          name: vulu-social-test-apk
          path: out/*-Signed.apk
          if-no-files-found: error

      # Her derlemede ön sürüm yeniden oluşturulur: indirme adresi hep aynı kalır, en yeni APK'yı verir
      - name: Ön sürüme yükle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp out/*-Signed.apk vulu-sosyal-test.apk
          gh release delete social-test --yes --cleanup-tag || true
          gh release create social-test vulu-sosyal-test.apk --prerelease --latest=false --target "$GITHUB_SHA" \
            --title "vulu Sosyal test" \
            --notes "Telefonda denemek için vulu Sosyal APK'sı ($GITHUB_REF_NAME, ${GITHUB_SHA::7}). Geçici test anahtarıyla imzalı; yayın sürümü değildir."
