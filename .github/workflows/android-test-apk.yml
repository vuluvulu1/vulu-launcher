# Telefonda denemek için Android APK'sı: GitHub'da derlenir, Actions sayfasından "artifact" olarak indirilir.
# Yayın anahtarıyla değil, SDK'nın geçici hata ayıklama anahtarıyla imzalanır: siteden kurulan sürümün üstüne
# kurulamaz (önce o silinir) ve yayınlanmaz. Yayın APK'sı yine tools/publish-android.ps1 ile çıkar.
name: Android test APK

on:
  workflow_dispatch:
  push:
    paths:
      - "Android/**"
      - "Core/**"
      - "Shared/**"
      - "Launcher/wwwroot/**"
      - ".github/workflows/android-test-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: "21"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: MAUI Android workload
        run: dotnet workload install maui-android

      - name: Android SDK paketleri
        run: >
          dotnet build Android/vuluLauncher.Android.csproj -f net10.0-android -t:InstallAndroidDependencies
          -p:AndroidSdkDirectory="$ANDROID_HOME" -p:JavaSdkDirectory="$JAVA_HOME" -p:AcceptAndroidSDKLicenses=True

      - name: Release APK
        run: >
          dotnet publish Android/vuluLauncher.Android.csproj -f net10.0-android -c Release -o out
          -p:AndroidSdkDirectory="$ANDROID_HOME" -p:JavaSdkDirectory="$JAVA_HOME"

      - uses: actions/upload-artifact@v4
        with:
          name: vulu-launcher-test-apk
          path: out/*-Signed.apk
          if-no-files-found: error
